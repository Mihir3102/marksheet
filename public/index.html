<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Details</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h1>Automatic Marksheet Generator</h1><nav><span class="active">1. Student Details</span><span>2. Marks Entry</span><span>3. Marksheet</span></nav><h2>Enter Student Details</h2><form id="studentForm"><div class="grid"><div><label for="student_name">Full Name</label><input id="student_name" maxlength="100" required pattern="[A-Za-z ]{2,100}" title="Use letters and spaces only"></div><div><label for="roll_no">Roll Number</label><input id="roll_no" maxlength="30" required pattern="[A-Za-z0-9-]+"></div><div><label for="class_name">Class</label><input id="class_name" maxlength="50" required placeholder="e.g. Third Year"></div><div><label for="semester">Semester</label><select id="semester" required><option value="">Select semester</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div></div><label for="department">Department</label><input id="department" maxlength="100" required placeholder="e.g. Computer Engineering"><p id="error" class="error" role="alert"></p><button type="submit">Next: Enter Marks →</button></form></main><script src="app.js"></script></body></html>
